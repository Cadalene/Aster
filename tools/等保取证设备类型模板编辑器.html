<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>等保取证 · 设备类型模板编辑器</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffdf8;
      --paper-2: #f8f6f0;
      --paper-3: #f0ede5;
      --ink: #1b2340;
      --muted: #777982;
      --line: #dedbd2;
      --line-strong: #c8c5bc;
      --blue: #2e43a8;
      --blue-deep: #202d70;
      --blue-soft: #e8ecf8;
      --yellow: #d3a92c;
      --yellow-soft: #fbf2ca;
      --red: #a64251;
      --red-soft: #f8e9ec;
      --green: #2e705d;
      --green-soft: #e7f1eb;
      --shadow: 0 12px 32px rgba(32, 45, 112, .08);
      --radius: 8px;
      --font-serif: Georgia, "Noto Serif SC", "Songti SC", SimSun, serif;
      --font-sans: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 84% -18%, rgba(46, 67, 168, .10), transparent 34rem),
        linear-gradient(135deg, #f7f5ef 0%, #efede6 100%);
      font-family: var(--font-sans);
      font-size: 14px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, .94);
      backdrop-filter: blur(14px);
    }
    .topbar-inner, .workspace, .footer-inner { width: min(1500px, 100%); margin: 0 auto; }
    .topbar-inner { display: flex; align-items: center; gap: 18px; padding: 20px 28px; }
    .brand-mark {
      width: 48px; height: 48px; flex: 0 0 auto;
      display: grid; place-items: center;
      color: #fff; background: var(--blue-deep);
      border: 1px solid var(--blue-deep); border-radius: 5px;
      font: 25px/1 var(--font-serif);
      box-shadow: 7px 7px 0 rgba(211, 169, 44, .25);
    }
    .eyebrow, .mono { font-family: var(--font-mono); }
    .eyebrow { color: var(--blue); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 4px; font: 26px/1.15 var(--font-serif); letter-spacing: -.03em; }
    .topbar-copy { min-width: 0; flex: 1; }
    .topbar-copy p { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .button {
      min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 5px;
      color: var(--ink); background: var(--paper);
      font-size: 13px; transition: background .12s ease, border-color .12s ease, transform .12s ease;
    }
    .button:hover { border-color: var(--blue); background: var(--blue-soft); }
    .button:active { transform: translateY(1px); }
    .button.primary { color: #fff; border-color: var(--blue); background: var(--blue); }
    .button.primary:hover { background: var(--blue-deep); }
    .button.subtle { color: var(--muted); background: transparent; }
    .file-button input { display: none; }
    .statusbar {
      display: flex; align-items: center; gap: 12px; min-height: 38px;
      padding: 7px 28px; border-bottom: 1px solid var(--line); background: var(--paper-2);
      color: var(--muted); font-size: 12px;
    }
    .statusbar .status-main { flex: 1; min-width: 0; }
    .statusbar .status-main strong { color: var(--ink); font-weight: 600; }
    .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 4px; font: 11px var(--font-mono); }
    .status-pill.ready { color: var(--green); background: var(--green-soft); }
    .status-pill.warn { color: var(--red); background: var(--red-soft); }
    .workspace {
      flex: 1; display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 18px;
      padding: 22px 28px 34px;
    }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255, 253, 248, .92); box-shadow: var(--shadow); }
    .sidebar { display: flex; flex-direction: column; min-height: 550px; overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 17px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font: 18px var(--font-serif); }
    .count { min-width: 24px; padding: 4px 7px; border-radius: 3px; color: var(--blue); background: var(--blue-soft); font: 11px var(--font-mono); text-align: center; }
    .search-wrap { padding: 12px; border-bottom: 1px solid var(--line); }
    .search-wrap input { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 4px; outline: none; color: var(--ink); background: #fff; }
    .search-wrap input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(46, 67, 168, .12); }
    .template-list { flex: 1; overflow: auto; padding: 9px; }
    .template-card {
      position: relative; display: flex; align-items: center; gap: 9px; width: 100%;
      margin-bottom: 5px; padding: 11px 9px; border: 1px solid transparent; border-radius: 5px;
      color: var(--ink); background: transparent; text-align: left;
    }
    .template-card:hover { background: var(--paper-2); }
    .template-card.selected { border-color: rgba(46, 67, 168, .22); background: var(--blue-soft); }
    .template-card.drag-over, .item-row.drag-over { border-color: var(--yellow); background: var(--yellow-soft); }
    .drag-handle { flex: 0 0 auto; color: #a9a69e; font: 16px/1 var(--font-mono); user-select: none; cursor: grab; }
    .template-card:active .drag-handle, .item-row:active .drag-handle { cursor: grabbing; }
    .template-card .template-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .template-card .template-meta { display: block; margin-top: 3px; color: var(--muted); font: 10px var(--font-mono); }
    .template-card .template-arrow { color: var(--blue); font-size: 18px; }
    .sidebar-foot { padding: 12px; border-top: 1px solid var(--line); }
    .sidebar-foot .button { width: 100%; }
    .editor { min-width: 0; }
    .empty-state { min-height: 550px; display: grid; place-items: center; padding: 40px; text-align: center; }
    .empty-state-inner { max-width: 480px; }
    .empty-symbol { width: 78px; height: 78px; margin: 0 auto 22px; display: grid; place-items: center; color: var(--blue); background: var(--blue-soft); border: 1px solid rgba(46, 67, 168, .18); border-radius: 5px; font: 38px var(--font-serif); }
    .empty-state h2 { font: 26px var(--font-serif); }
    .empty-state p { margin-top: 10px; color: var(--muted); line-height: 1.7; }
    .empty-state .button { margin-top: 22px; }
    .editor-panel { overflow: hidden; }
    .editor-head { padding: 21px 22px 17px; border-bottom: 1px solid var(--line); }
    .editor-head-top { display: flex; align-items: flex-start; gap: 16px; }
    .editor-title { flex: 1; min-width: 0; }
    .editor-title label { display: block; margin-bottom: 7px; color: var(--muted); font: 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
    .template-name-input { width: 100%; padding: 0 0 5px; border: 0; border-bottom: 2px solid var(--line-strong); outline: none; color: var(--ink); background: transparent; font: 28px/1.2 var(--font-serif); }
    .template-name-input:focus { border-color: var(--blue); }
    .editor-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-button { width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--paper); }
    .icon-button:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
    .icon-button.danger:hover { color: var(--red); border-color: var(--red); background: var(--red-soft); }
    .editor-summary { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 17px; }
    .summary-chip { padding: 6px 9px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); background: var(--paper-2); font: 11px var(--font-mono); }
    .summary-chip strong { color: var(--ink); font-weight: 600; }
    .items-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 22px 12px; }
    .items-head h2 { font: 20px var(--font-serif); }
    .items-head p { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .items-list { padding: 0 22px 22px; }
    .item-row {
      display: grid; grid-template-columns: 34px minmax(170px, 1fr) 150px 148px 86px; gap: 11px; align-items: center;
      min-height: 65px; padding: 9px 10px; margin-bottom: 7px; border: 1px solid var(--line); border-radius: 5px; background: #fff;
    }
    .item-row.reserved { background: var(--paper-2); }
    .item-index { color: var(--muted); font: 11px var(--font-mono); text-align: center; }
    .item-name-input, .word-input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 3px; outline: none; color: var(--ink); background: #fff; }
    .item-name-input:focus, .word-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(46, 67, 168, .10); }
    .item-name-input:disabled { color: var(--muted); background: var(--paper-3); }
    .field-label { display: block; margin-bottom: 4px; color: var(--muted); font: 10px var(--font-mono); }
    .key-field { display: flex; align-items: center; gap: 8px; min-height: 37px; padding: 0 7px; color: var(--ink); font-size: 12px; }
    .key-field input { width: 17px; height: 17px; accent-color: var(--blue); }
    .reserved-mark { color: var(--muted); font: 11px var(--font-mono); }
    .row-actions { display: flex; justify-content: flex-end; gap: 4px; }
    .mini-button { width: 26px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); background: var(--paper); }
    .mini-button:hover { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
    .mini-button.danger:hover { color: var(--red); border-color: var(--red); background: var(--red-soft); }
    .add-item-row { display: flex; align-items: center; justify-content: center; min-height: 52px; border: 1px dashed var(--line-strong); border-radius: 5px; }
    .add-item-row button { border: 0; color: var(--blue); background: transparent; font-size: 13px; }
    .editor-note { padding: 13px 22px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.7; }
    .editor-note code { padding: 2px 4px; color: var(--blue-deep); background: var(--blue-soft); font-family: var(--font-mono); }
    .footer { border-top: 1px solid var(--line); background: rgba(255, 253, 248, .7); }
    .footer-inner { display: flex; justify-content: space-between; gap: 12px; padding: 13px 28px; color: var(--muted); font: 11px var(--font-mono); }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 20; max-width: min(430px, calc(100vw - 48px)); padding: 12px 15px; border: 1px solid var(--line-strong); border-radius: 5px; color: var(--ink); background: var(--paper); box-shadow: var(--shadow); line-height: 1.5; }
    .toast.warn { color: var(--red); border-color: #e0b7bf; background: var(--red-soft); }
    .toast[hidden] { display: none; }
    .dialog-backdrop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(27, 35, 64, .34); backdrop-filter: blur(4px); }
    .dialog-backdrop[hidden] { display: none; }
    .dialog-card { width: min(440px, 100%); padding: 22px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--paper); box-shadow: 0 24px 70px rgba(27, 35, 64, .22); }
    .dialog-card h2 { font: 22px var(--font-serif); }
    .dialog-card p { margin-top: 9px; color: var(--muted); line-height: 1.65; }
    .dialog-card input { width: 100%; margin-top: 15px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px; outline: none; color: var(--ink); background: #fff; }
    .dialog-card input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(46, 67, 168, .12); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .dialog-actions .danger { color: #fff; border-color: var(--red); background: var(--red); }
    @media (max-width: 1050px) {
      .topbar-inner { align-items: flex-start; flex-wrap: wrap; }
      .top-actions { width: 100%; justify-content: flex-start; padding-left: 66px; }
      .workspace { grid-template-columns: 260px minmax(0, 1fr); }
      .item-row { grid-template-columns: 28px minmax(150px, 1fr) 120px 120px 76px; gap: 7px; }
    }
    @media (max-width: 800px) {
      .topbar-inner, .statusbar, .workspace, .footer-inner { padding-left: 16px; padding-right: 16px; }
      .workspace { display: block; }
      .sidebar { min-height: 0; margin-bottom: 14px; }
      .template-list { max-height: 260px; }
      .empty-state { min-height: 400px; }
      .editor-head-top { display: block; }
      .editor-actions { justify-content: flex-start; margin-top: 14px; }
      .items-head { align-items: flex-start; flex-direction: column; }
      .item-row { grid-template-columns: 28px minmax(0, 1fr) 74px; gap: 8px; padding: 10px; }
      .item-key-cell, .item-word-cell { grid-column: 2 / 3; }
      .row-actions { grid-column: 3 / 4; grid-row: 1 / span 2; align-self: start; flex-direction: column; }
      .item-index { align-self: start; padding-top: 10px; }
    }
    @media (max-width: 520px) {
      h1 { font-size: 23px; }
      .brand-mark { width: 42px; height: 42px; font-size: 22px; }
      .top-actions { padding-left: 0; }
      .top-actions .button { flex: 1 1 auto; }
      .statusbar { align-items: flex-start; flex-direction: column; }
      .status-pill { align-self: flex-start; }
      .editor-head, .items-head, .items-list, .editor-note { padding-left: 14px; padding-right: 14px; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="dropTarget">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-mark" aria-hidden="true">E</div>
        <div class="topbar-copy">
          <div class="eyebrow">EVIDENCE TEMPLATE STUDIO</div>
          <h1>设备类型模板编辑器</h1>
          <p>编辑 App 导出的 JSON；App 显示顺序拖动调整，Word 顺序填写数字。</p>
        </div>
        <div class="top-actions">
          <label class="button file-button">打开 JSON<input id="fileInput" type="file" accept=".json,application/json,text/plain"></label>
          <button class="button" id="newTemplateButton" type="button">＋ 新建模板</button>
          <button class="button primary" id="exportButton" type="button">↓ 导出 JSON</button>
        </div>
      </div>
    </header>

    <div class="statusbar">
      <div class="status-main" id="fileStatus">尚未打开文件。可以把 JSON 文件拖到此页面，或点击“打开 JSON”。</div>
      <span class="status-pill ready" id="validityStatus">● 可导出</span>
    </div>

    <main class="workspace">
      <aside class="panel sidebar">
        <div class="panel-head"><h2>设备类型模板</h2><span class="count" id="templateCount">0</span></div>
        <div class="search-wrap"><input id="templateSearch" type="search" placeholder="搜索模板名称…" autocomplete="off"></div>
        <div class="template-list" id="templateList"></div>
        <div class="sidebar-foot"><button class="button" id="sidebarNewButton" type="button">＋ 新建设备类型模板</button></div>
      </aside>

      <section class="editor" id="editorRoot"></section>
    </main>

    <footer class="footer">
      <div class="footer-inner"><span>格式版本 1 · 本地运行 · 不上传文件</span><span>拖动排序 · Ctrl / ⌘ + S 导出</span></div>
    </footer>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="dialog-backdrop" id="dialogBackdrop" hidden>
    <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle"></h2>
      <p id="dialogMessage"></p>
      <input id="dialogInput" type="text" autocomplete="off" hidden>
      <div class="dialog-actions">
        <button class="button subtle" id="dialogCancel" type="button">取消</button>
        <button class="button primary" id="dialogConfirm" type="button">确定</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const OTHER = '其他';
      const state = {
        templates: [],
        selectedId: null,
        search: '',
        fileName: '',
        dirty: false,
      };
      let uidSeed = 1;
      let toastTimer = null;
      const dialogState = { input: false, onConfirm: null };
      const $ = (selector) => document.querySelector(selector);

      function uid(prefix = 'id') { return `${prefix}_${Date.now().toString(36)}_${(uidSeed++).toString(36)}`; }
      function clean(value) { return String(value ?? '').trim(); }
      function integer(value, fallback) {
        const number = Number(value);
        return Number.isFinite(number) ? Math.trunc(number) : fallback;
      }
      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
      }
      function escapeAttribute(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
      function showToast(message, warning = false) {
        const toast = $('#toast');
        toast.textContent = message;
        toast.classList.toggle('warn', warning);
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 3600);
      }

      function openDialog({ title, message = '', input = false, initial = '', confirmText = '确定', danger = false, onConfirm }) {
        const backdrop = $('#dialogBackdrop');
        const inputElement = $('#dialogInput');
        $('#dialogTitle').textContent = title;
        $('#dialogMessage').textContent = message;
        $('#dialogConfirm').textContent = confirmText;
        $('#dialogConfirm').classList.toggle('danger', danger);
        inputElement.hidden = !input;
        inputElement.value = initial;
        dialogState.input = input;
        dialogState.onConfirm = onConfirm;
        backdrop.hidden = false;
        requestAnimationFrame(() => (input ? inputElement : $('#dialogCancel')).focus());
      }
      function closeDialog() {
        $('#dialogBackdrop').hidden = true;
        dialogState.input = false;
        dialogState.onConfirm = null;
      }

      function makeOther() {
        return { id: uid('item'), name: OTHER, displayOrder: 0, isKeyScreenshot: false, wordOrder: null, excludedFromProgress: true };
      }

      function uniqueName(name, used, fallback) {
        let candidate = clean(name) || fallback;
        if (!used.has(candidate)) { used.add(candidate); return candidate; }
        let index = 2;
        while (used.has(`${candidate}（${index}）`)) index += 1;
        candidate = `${candidate}（${index}）`;
        used.add(candidate);
        return candidate;
      }

      function normalizePackage(parsed) {
        if (!parsed || integer(parsed.formatVersion, -1) !== 1) throw new Error('不支持的模板文件版本；当前只支持 formatVersion = 1。');
        if (!Array.isArray(parsed.templates) || parsed.templates.length === 0) throw new Error('模板文件中没有设备类型。');
        const warnings = [];
        const templateUsed = new Set();
        const templates = parsed.templates
          .map((raw, index) => ({ raw, index }))
          .sort((a, b) => integer(a.raw.sortOrder, a.index) - integer(b.raw.sortOrder, b.index))
          .map(({ raw, index }, templateIndex) => {
            const nameBefore = clean(raw.name);
            const name = uniqueName(nameBefore, templateUsed, `未命名设备类型 ${templateIndex + 1}`);
            if (name !== nameBefore && nameBefore) warnings.push(`模板“${nameBefore}”存在重复名称，已临时改为“${name}”。`);
            const used = new Set();
            const sourceItems = Array.isArray(raw.items) ? raw.items : [];
            const items = sourceItems
              .map((item, itemIndex) => ({ item, itemIndex }))
              .sort((a, b) => integer(a.item.displayOrder, a.itemIndex) - integer(b.item.displayOrder, b.itemIndex))
              .map(({ item }) => {
                const itemName = clean(item.name);
                if (!itemName || itemName === OTHER) return null;
                const normalizedName = uniqueName(itemName, used, '新的取证项');
                if (normalizedName !== itemName) warnings.push(`“${name}”中存在同名取证项，已临时改为“${normalizedName}”。`);
                const rawWord = item.wordOrder === null || item.wordOrder === undefined ? null : integer(item.wordOrder, -1);
                return {
                  id: uid('item'),
                  name: normalizedName,
                  displayOrder: 0,
                  isKeyScreenshot: Boolean(item.isKeyScreenshot),
                  // App JSON stores Word order as zero-based; the editor shows one-based numbers.
                  wordOrder: rawWord !== null && rawWord >= 0 ? rawWord + 1 : null,
                  excludedFromProgress: false,
                };
              })
              .filter(Boolean);
            items.forEach((item, itemIndex) => { item.displayOrder = itemIndex; });
            const other = makeOther();
            other.displayOrder = items.length;
            items.push(other);
            return { id: uid('template'), name, sortOrder: templateIndex, items };
          });
        return { templates, warnings };
      }

      function normalizeForExport() {
        return {
          formatVersion: 1,
          exportedAt: Date.now(),
          templates: state.templates.map((template, templateIndex) => ({
            name: clean(template.name),
            sortOrder: templateIndex,
            items: template.items.map((item, itemIndex) => ({
              name: clean(item.name),
              displayOrder: itemIndex,
              isKeyScreenshot: item.name === OTHER ? false : Boolean(item.isKeyScreenshot),
              wordOrder: item.name === OTHER || item.wordOrder === null ? null : Math.max(0, integer(item.wordOrder, 1) - 1),
              excludedFromProgress: item.name === OTHER,
            })),
          })),
        };
      }

      function validationErrors() {
        const errors = [];
        if (!state.templates.length) errors.push('至少需要一个设备类型模板。');
        const templateNames = new Set();
        state.templates.forEach((template, templateIndex) => {
          const name = clean(template.name);
          if (!name) errors.push(`第 ${templateIndex + 1} 个设备类型名称为空。`);
          if (templateNames.has(name)) errors.push(`设备类型“${name}”重复。`);
          templateNames.add(name);
          const items = template.items || [];
          const itemNames = new Set();
          let otherCount = 0;
          items.forEach((item, itemIndex) => {
            const itemName = clean(item.name);
            if (!itemName) errors.push(`“${name}”的第 ${itemIndex + 1} 个取证项名称为空。`);
            if (itemNames.has(itemName)) errors.push(`“${name}”中存在同名取证项“${itemName}”。`);
            itemNames.add(itemName);
            if (itemName === OTHER) {
              otherCount += 1;
              if (itemIndex !== items.length - 1) errors.push(`“${name}”的“其他”必须位于最后。`);
            }
            if (item.wordOrder !== null && (!Number.isInteger(Number(item.wordOrder)) || Number(item.wordOrder) < 1)) errors.push(`“${name} / ${itemName}”的 Word 顺序无效。`);
          });
          if (otherCount !== 1) errors.push(`“${name}”必须保留且只能有一个“其他”。`);
        });
        return errors;
      }

      function activeTemplate() { return state.templates.find(template => template.id === state.selectedId) || null; }
      function itemCount(template) { return Math.max(0, (template.items || []).length - 1); }
      function keyCount(template) { return (template.items || []).filter(item => item.name !== OTHER && item.isKeyScreenshot).length; }

      function render() {
        renderStatus();
        renderTemplateList();
        renderEditor();
      }

      function renderStatus() {
        const fileStatus = $('#fileStatus');
        if (state.fileName) {
          fileStatus.innerHTML = `<strong>${escapeHtml(state.fileName)}</strong> · ${state.dirty ? '有未导出的修改' : '已加载'}`;
        } else {
          fileStatus.textContent = state.templates.length ? '新建模板草稿 · 尚未导出文件' : '尚未打开文件。可以把 JSON 文件拖到此页面，或点击“打开 JSON”。';
        }
        const errors = validationErrors();
        const validity = $('#validityStatus');
        validity.classList.toggle('ready', errors.length === 0);
        validity.classList.toggle('warn', errors.length > 0);
        validity.textContent = errors.length ? `● ${errors.length} 项需要修正` : '● 可导出';
        $('#exportButton').disabled = errors.length > 0;
        $('#templateCount').textContent = state.templates.length;
      }

      function renderTemplateList() {
        const list = $('#templateList');
        const query = state.search.toLowerCase();
        const visible = state.templates.filter(template => template.name.toLowerCase().includes(query));
        if (!visible.length) {
          list.innerHTML = `<div style="padding:28px 12px;color:var(--muted);text-align:center;line-height:1.7">${state.templates.length ? '没有匹配的设备类型。' : '还没有模板。<br>可以新建，或打开 App 导出的 JSON。'}</div>`;
          return;
        }
        list.innerHTML = visible.map((template) => `
          <div class="template-card ${template.id === state.selectedId ? 'selected' : ''}" draggable="true" data-template-id="${escapeAttribute(template.id)}">
            <span class="drag-handle" title="拖动改变模板顺序">⁙</span>
            <button type="button" data-action="select-template" data-id="${escapeAttribute(template.id)}" style="min-width:0;flex:1;border:0;padding:0;color:inherit;background:transparent;text-align:left">
              <span class="template-name">${escapeHtml(template.name || '未命名设备类型')}</span>
              <span class="template-meta">${itemCount(template)} 个取证项 · ${keyCount(template)} 个关键截图项</span>
            </button>
            <span class="template-arrow">›</span>
          </div>`).join('');
        list.querySelectorAll('.template-card').forEach(card => {
          card.addEventListener('dragstart', event => {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', `template:${card.dataset.templateId}`);
            card.classList.add('dragging');
          });
          card.addEventListener('dragend', () => card.classList.remove('dragging'));
          card.addEventListener('dragover', event => { event.preventDefault(); card.classList.add('drag-over'); });
          card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
          card.addEventListener('drop', event => {
            event.preventDefault();
            event.stopPropagation();
            card.classList.remove('drag-over');
            const payload = event.dataTransfer.getData('text/plain');
            if (!payload.startsWith('template:')) return;
            moveTemplate(payload.slice(9), card.dataset.templateId);
          });
        });
      }

      function renderEditor() {
        const root = $('#editorRoot');
        const template = activeTemplate();
        if (!template) {
          root.innerHTML = `<div class="panel empty-state"><div class="empty-state-inner"><div class="empty-symbol">E</div><h2>开始编辑模板</h2><p>打开 App 导出的设备类型模板 JSON 后，可以在这里修改模板名称、取证项、关键截图标记和 Word 排列顺序。</p><button class="button primary" type="button" data-action="open-file">打开 JSON 文件</button></div></div>`;
          return;
        }
        const errors = validationErrors().filter(error => error.includes(`“${template.name}”`) || error.includes(`第 ${state.templates.indexOf(template) + 1} 个`));
        root.innerHTML = `
          <div class="panel editor-panel">
            <div class="editor-head">
              <div class="editor-head-top">
                <div class="editor-title">
                  <label>DEVICE TYPE TEMPLATE</label>
                  <input class="template-name-input" data-field="template-name" value="${escapeAttribute(template.name)}" aria-label="设备类型名称">
                </div>
                <div class="editor-actions">
                  <button class="icon-button" type="button" data-action="duplicate-template" title="复制当前模板">⧉</button>
                  <button class="icon-button danger" type="button" data-action="delete-template" title="删除当前模板">×</button>
                </div>
              </div>
              <div class="editor-summary">
                <span class="summary-chip">App 顺序 <strong>拖动调整</strong></span>
                <span class="summary-chip">Word 顺序 <strong>填写数字</strong></span>
                <span class="summary-chip">普通项 <strong>${itemCount(template)}</strong></span>
                <span class="summary-chip">关键截图 <strong>${keyCount(template)}</strong></span>
              </div>
              ${errors.length ? `<div style="margin-top:12px;padding:9px 11px;border:1px solid #e0b7bf;border-radius:4px;color:var(--red);background:var(--red-soft);font-size:12px">${errors.map(escapeHtml).join('<br>')}</div>` : ''}
            </div>
            <div class="items-head"><div><h2>取证项</h2><p>拖动左侧手柄改变 App 中的显示顺序；“其他”为每个模板自动保留的最后一项。</p></div><button class="button" type="button" data-action="add-item">＋ 添加取证项</button></div>
            <div class="items-list" id="itemsList">${renderItems(template)}</div>
            <div class="editor-note">导出时会自动写回 <code>formatVersion: 1</code>、模板顺序和取证项顺序。Word 顺序在界面中从 1 开始填写，导出时转换为 App 使用的内部顺序；没有 Word 顺序的项目导出为 <code>null</code>。</div>
          </div>`;
        bindItemDragAndDrop();
      }

      function renderItems(template) {
        return template.items.map((item, index) => {
          const reserved = item.name === OTHER;
          return `
            <article class="item-row ${reserved ? 'reserved' : ''}" draggable="${reserved ? 'false' : 'true'}" data-item-id="${escapeAttribute(item.id)}">
              <div class="item-index"><span class="drag-handle" title="拖动改变顺序">${reserved ? '·' : '⁙'}</span><br>${index + 1}</div>
              <div><label class="field-label">取证项名称</label><input class="item-name-input" data-field="item-name" data-item-id="${escapeAttribute(item.id)}" value="${escapeAttribute(item.name)}" ${reserved ? 'disabled' : ''}></div>
              <div class="item-key-cell"><label class="field-label">关键设备截图项</label><label class="key-field"><input type="checkbox" data-field="key" data-item-id="${escapeAttribute(item.id)}" ${item.isKeyScreenshot ? 'checked' : ''} ${reserved ? 'disabled' : ''}> 属于关键截图项</label></div>
              <div class="item-word-cell"><label class="field-label">Word 排列顺序</label><input class="word-input" data-field="word-order" data-item-id="${escapeAttribute(item.id)}" type="number" min="1" step="1" placeholder="不进入 Word" value="${item.wordOrder ?? ''}" ${reserved ? 'disabled' : ''}></div>
              <div class="row-actions">
                <button class="mini-button" type="button" data-action="move-item-up" data-id="${escapeAttribute(item.id)}" ${reserved || index === 0 ? 'disabled' : ''} title="上移">↑</button>
                <button class="mini-button" type="button" data-action="move-item-down" data-id="${escapeAttribute(item.id)}" ${reserved || index === template.items.length - 2 ? 'disabled' : ''} title="下移">↓</button>
                <button class="mini-button danger" type="button" data-action="delete-item" data-id="${escapeAttribute(item.id)}" ${reserved ? 'disabled' : ''} title="删除">×</button>
              </div>
            </article>`;
        }).join('') + `<div class="add-item-row"><button type="button" data-action="add-item">＋ 添加一个取证项</button></div>`;
      }

      function bindItemDragAndDrop() {
        $('#itemsList')?.querySelectorAll('.item-row[draggable="true"]').forEach(row => {
          row.addEventListener('dragstart', event => {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', `item:${row.dataset.itemId}`);
            row.classList.add('dragging');
          });
          row.addEventListener('dragend', () => row.classList.remove('dragging'));
          row.addEventListener('dragover', event => { event.preventDefault(); row.classList.add('drag-over'); });
          row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
          row.addEventListener('drop', event => {
            event.preventDefault();
            event.stopPropagation();
            row.classList.remove('drag-over');
            const payload = event.dataTransfer.getData('text/plain');
            if (!payload.startsWith('item:')) return;
            moveItem(payload.slice(5), row.dataset.itemId);
          });
        });
      }

      function markDirty() { state.dirty = true; renderStatus(); }
      function refreshEditorSummary() {
        const template = activeTemplate();
        const values = $('#editorRoot')?.querySelectorAll('.summary-chip strong');
        if (!template || !values || values.length < 4) return;
        values[2].textContent = itemCount(template);
        values[3].textContent = keyCount(template);
      }
      function selectTemplate(id) { if (state.templates.some(template => template.id === id)) { state.selectedId = id; render(); } }

      function reorderTemplates() {
        state.templates.forEach((template, index) => { template.sortOrder = index; });
      }
      function moveTemplate(sourceId, targetId) {
        if (sourceId === targetId) return;
        const from = state.templates.findIndex(template => template.id === sourceId);
        const to = state.templates.findIndex(template => template.id === targetId);
        if (from < 0 || to < 0) return;
        const [moved] = state.templates.splice(from, 1);
        state.templates.splice(to, 0, moved);
        reorderTemplates(); markDirty(); render();
      }

      function normalizeItemOrders(template) {
        const other = template.items.find(item => item.name === OTHER) || makeOther();
        const normal = template.items.filter(item => item.name !== OTHER);
        normal.forEach((item, index) => { item.displayOrder = index; });
        other.displayOrder = normal.length;
        other.isKeyScreenshot = false; other.wordOrder = null; other.excludedFromProgress = true;
        template.items = [...normal, other];
      }
      function moveItem(sourceId, targetId) {
        const template = activeTemplate();
        if (!template || sourceId === targetId) return;
        const sourceIndex = template.items.findIndex(item => item.id === sourceId);
        const targetIndex = template.items.findIndex(item => item.id === targetId);
        if (sourceIndex < 0 || targetIndex < 0 || template.items[sourceIndex].name === OTHER || template.items[targetIndex].name === OTHER) return;
        const [moved] = template.items.splice(sourceIndex, 1);
        template.items.splice(targetIndex, 0, moved);
        normalizeItemOrders(template); markDirty(); render();
      }
      function moveItemByOffset(id, offset) {
        const template = activeTemplate();
        if (!template) return;
        const index = template.items.findIndex(item => item.id === id);
        const target = index + offset;
        if (index < 0 || target < 0 || target >= template.items.length - 1) return;
        [template.items[index], template.items[target]] = [template.items[target], template.items[index]];
        normalizeItemOrders(template); markDirty(); render();
      }

      function addTemplate(copyFrom = null) {
        const base = copyFrom || { name: '新设备类型', items: [makeOther()] };
        const used = new Set(state.templates.map(template => template.name));
        const template = {
          id: uid('template'),
          name: uniqueName(copyFrom ? `${base.name}（副本）` : base.name, used, '新设备类型'),
          sortOrder: state.templates.length,
          items: (base.items || []).filter(item => item.name !== OTHER).map((item, index) => ({
            id: uid('item'), name: item.name, displayOrder: index, isKeyScreenshot: Boolean(item.isKeyScreenshot), wordOrder: item.wordOrder === null ? null : Number(item.wordOrder), excludedFromProgress: false,
          })).concat([makeOther()]),
        };
        normalizeItemOrders(template);
        state.templates.push(template); state.selectedId = template.id; state.dirty = true; render();
        requestAnimationFrame(() => $('.template-name-input')?.focus());
      }

      function addItem() {
        const template = activeTemplate();
        if (!template) return;
        openDialog({
          title: '添加取证项',
          message: '输入名称后，会插入到“其他”之前。之后可以继续调整 App 顺序和 Word 顺序。',
          input: true,
          initial: '新的取证项',
          confirmText: '添加',
          onConfirm: value => {
            const name = clean(value);
            if (!name) return showToast('取证项名称不能为空。', true);
            if (name === OTHER) return showToast('“其他”是模板保留项，不能作为普通取证项添加。', true);
            if (template.items.some(item => item.name === name)) return showToast('当前模板已经存在同名取证项。', true);
            const other = template.items.find(item => item.name === OTHER);
            template.items = template.items.filter(item => item.name !== OTHER);
            template.items.push({ id: uid('item'), name, displayOrder: template.items.length, isKeyScreenshot: false, wordOrder: null, excludedFromProgress: false });
            template.items.push(other || makeOther());
            normalizeItemOrders(template); markDirty(); render();
          },
        });
      }

      function deleteItem(id) {
        const template = activeTemplate();
        const item = template?.items.find(candidate => candidate.id === id);
        if (!template || !item || item.name === OTHER) return;
        openDialog({
          title: '删除取证项？',
          message: `删除“${item.name}”后，当前编辑器中的模板会立即移除这一项。`,
          confirmText: '删除',
          danger: true,
          onConfirm: () => {
            template.items = template.items.filter(candidate => candidate.id !== id);
            normalizeItemOrders(template); markDirty(); render();
          },
        });
      }

      function deleteTemplate() {
        const template = activeTemplate();
        if (!template) return;
        openDialog({
          title: '删除设备类型模板？',
          message: `删除“${template.name}”后，当前编辑器中的模板会立即移除。请确认已经保存需要保留的 JSON。`,
          confirmText: '删除',
          danger: true,
          onConfirm: () => {
            state.templates = state.templates.filter(candidate => candidate.id !== template.id);
            reorderTemplates(); state.selectedId = state.templates[0]?.id || null; markDirty(); render();
          },
        });
      }

      function duplicateTemplate() { const template = activeTemplate(); if (template) addTemplate(template); }

      function downloadJson() {
        const errors = validationErrors();
        if (errors.length) { showToast(errors.join('；'), true); return; }
        const packageData = normalizeForExport();
        const base = clean(state.fileName).replace(/\.json$/i, '') || `等保取证_设备类型模板_${new Date().toISOString().slice(0, 10).replaceAll('-', '')}`;
        const blob = new Blob([JSON.stringify(packageData, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url; anchor.download = `${base}.json`; anchor.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        state.dirty = false; renderStatus(); showToast(`已导出 ${base}.json`);
      }

      function openFilePicker() { $('#fileInput').click(); }
      function readFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result || ''));
            const normalized = normalizePackage(parsed);
            state.templates = normalized.templates;
            state.selectedId = state.templates[0]?.id || null;
            state.fileName = file.name;
            state.dirty = false;
            render();
            if (normalized.warnings.length) showToast(`已打开文件；${normalized.warnings[0]}`, true);
            else showToast(`已打开 ${file.name}`);
          } catch (error) {
            showToast(error.message || 'JSON 文件读取失败。', true);
          }
        };
        reader.onerror = () => showToast('文件读取失败。', true);
        reader.readAsText(file, 'utf-8');
      }

      $('#fileInput').addEventListener('change', event => readFile(event.target.files[0]));
      $('#templateSearch').addEventListener('input', event => { state.search = event.target.value; renderTemplateList(); });
      $('#newTemplateButton').addEventListener('click', () => addTemplate());
      $('#sidebarNewButton').addEventListener('click', () => addTemplate());
      $('#exportButton').addEventListener('click', downloadJson);
      $('#dialogCancel').addEventListener('click', closeDialog);
      $('#dialogConfirm').addEventListener('click', () => {
        const handler = dialogState.onConfirm;
        const value = $('#dialogInput').value;
        const hasInput = dialogState.input;
        closeDialog();
        handler?.(hasInput ? value : undefined);
      });
      $('#dialogBackdrop').addEventListener('click', event => { if (event.target.id === 'dialogBackdrop') closeDialog(); });
      $('#dialogInput').addEventListener('keydown', event => { if (event.key === 'Enter') $('#dialogConfirm').click(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && !$('#dialogBackdrop').hidden) closeDialog(); });
      $('#editorRoot').addEventListener('click', event => {
        const actionNode = event.target.closest('[data-action]');
        if (!actionNode) return;
        const action = actionNode.dataset.action;
        if (action === 'open-file') return openFilePicker();
        if (action === 'select-template') return selectTemplate(actionNode.dataset.id);
        if (action === 'add-item') return addItem();
        if (action === 'delete-item') return deleteItem(actionNode.dataset.id);
        if (action === 'move-item-up') return moveItemByOffset(actionNode.dataset.id, -1);
        if (action === 'move-item-down') return moveItemByOffset(actionNode.dataset.id, 1);
        if (action === 'delete-template') return deleteTemplate();
        if (action === 'duplicate-template') return duplicateTemplate();
      });
      $('#templateList').addEventListener('click', event => {
        const actionNode = event.target.closest('[data-action="select-template"]');
        if (actionNode) selectTemplate(actionNode.dataset.id);
      });
      $('#editorRoot').addEventListener('input', event => {
        const field = event.target.dataset.field;
        const template = activeTemplate();
        if (!template || !field) return;
        if (field === 'template-name') { template.name = event.target.value; markDirty(); renderTemplateList(); return; }
        const item = template.items.find(candidate => candidate.id === event.target.dataset.itemId);
        if (!item) return;
        if (field === 'item-name') {
          if (event.target.value.trim() === OTHER) { event.target.value = item.name; showToast('“其他”是模板保留项，不能重命名为“其他”。', true); return; }
          item.name = event.target.value; markDirty(); renderStatus(); renderTemplateList(); refreshEditorSummary();
        } else if (field === 'word-order') {
          item.wordOrder = event.target.value === '' ? null : integer(event.target.value, null); markDirty(); renderStatus();
        }
      });
      $('#editorRoot').addEventListener('change', event => {
        const field = event.target.dataset.field;
        const template = activeTemplate();
        if (!template || !field) return;
        const item = template.items.find(candidate => candidate.id === event.target.dataset.itemId);
        if (field === 'key' && item) { item.isKeyScreenshot = event.target.checked; markDirty(); renderStatus(); renderTemplateList(); refreshEditorSummary(); }
        if (field === 'word-order' && item && item.wordOrder !== null && item.wordOrder < 1) { item.wordOrder = null; event.target.value = ''; showToast('Word 顺序必须从 1 开始。', true); }
      });
      document.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') { event.preventDefault(); downloadJson(); }
      });
      const dropTarget = $('#dropTarget');
      ['dragenter', 'dragover'].forEach(type => dropTarget.addEventListener(type, event => { event.preventDefault(); dropTarget.style.outline = '3px solid rgba(46,67,168,.25)'; }));
      ['dragleave', 'drop'].forEach(type => dropTarget.addEventListener(type, event => { event.preventDefault(); dropTarget.style.outline = ''; }));
      dropTarget.addEventListener('drop', event => {
        const file = [...(event.dataTransfer.files || [])].find(candidate => /\.json$/i.test(candidate.name) || candidate.type === 'application/json' || candidate.type === 'text/plain');
        if (file) readFile(file); else showToast('请拖入 JSON 模板文件。', true);
      });

      // Start with an empty editor; the actual App export is loaded from the user's file.
      render();
    })();
  </script>
</body>
</html>
