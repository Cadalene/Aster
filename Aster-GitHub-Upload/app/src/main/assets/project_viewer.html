<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>等保现场取证</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --line: #d9e0e5;
      --text: #17212b;
      --muted: #63717d;
      --primary: #235b8f;
      --primary-soft: #e8f0f7;
      --success: #167457;
      --success-soft: #e4f3ed;
      --danger: #b42318;
      --danger-soft: #ffe9e7;
      --warning: #a15c00;
      --warning-soft: #fff0d5;
      --shadow: 0 1px 3px rgba(23, 33, 43, .08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    body { font-size: 14px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 22px 28px 18px; }
    .topbar-row { max-width: 1440px; width: 100%; margin: 0 auto; display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; }
    .eyebrow { color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 24px; line-height: 1.3; font-weight: 650; }
    .project-meta { margin-top: 7px; color: var(--muted); }
    .summary { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .summary-stat { min-width: 84px; padding: 8px 12px; border: 1px solid var(--line); background: #fbfcfd; border-radius: 6px; text-align: right; }
    .summary-value { display: block; font-weight: 650; font-size: 18px; }
    .summary-label { color: var(--muted); font-size: 12px; }
    .toolbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 28px; position: sticky; top: 0; z-index: 4; }
    .toolbar-inner { max-width: 1440px; width: 100%; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .mode-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fbfcfd; }
    .mode-tabs button { border: 0; border-right: 1px solid var(--line); padding: 8px 14px; background: transparent; color: var(--muted); }
    .mode-tabs button:last-child { border-right: 0; }
    .mode-tabs button.active { background: var(--primary); color: #fff; }
    .search { flex: 1 1 220px; max-width: 420px; min-width: 180px; border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; outline: none; background: #fff; }
    .search:focus, .filter:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(35, 91, 143, .12); }
    .filter { border: 1px solid var(--line); border-radius: 6px; padding: 9px 28px 9px 10px; background: #fff; color: var(--text); }
    .record-count { color: var(--muted); margin-left: auto; white-space: nowrap; }
    .workspace { max-width: 1440px; width: 100%; margin: 0 auto; padding: 18px 28px 40px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; flex: 1; }
    .sidebar { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; align-self: start; overflow: hidden; box-shadow: var(--shadow); }
    .sidebar-heading { padding: 14px 15px; border-bottom: 1px solid var(--line); font-weight: 650; }
    .sidebar-group-title { padding: 12px 15px 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .sidebar-list { padding: 0 8px 10px; }
    .sidebar-item { width: 100%; display: flex; gap: 8px; align-items: center; text-align: left; border: 0; border-radius: 5px; padding: 9px 8px; background: transparent; color: var(--text); }
    .sidebar-item:hover { background: #f2f5f7; }
    .sidebar-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    .sidebar-item .item-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .sidebar-item .item-count { color: var(--muted); font-size: 12px; }
    .sidebar-item.active .item-count { color: var(--primary); }
    .missing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); flex: 0 0 auto; }
    .content { min-width: 0; }
    .content-heading { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    .content-heading h2 { font-size: 21px; line-height: 1.35; font-weight: 650; }
    .content-heading p { color: var(--muted); margin-top: 5px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .badge { border-radius: 4px; padding: 4px 8px; font-size: 12px; line-height: 1.2; white-space: nowrap; }
    .badge.success { background: var(--success-soft); color: var(--success); }
    .badge.danger { background: var(--danger-soft); color: var(--danger); }
    .badge.warning { background: var(--warning-soft); color: var(--warning); }
    .badge.neutral { background: #e8edf1; color: #566572; }
    .item-section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow); }
    .item-header { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px 11px; border-bottom: 1px solid var(--line); }
    .item-header-main { min-width: 0; flex: 1; }
    .item-title { font-size: 16px; font-weight: 650; line-height: 1.4; overflow-wrap: anywhere; }
    .item-subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .item-body { padding: 13px 15px 15px; }
    .note { background: #fbfcfd; border-left: 3px solid #9aabb7; padding: 9px 11px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 12px; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .photo { display: block; position: relative; padding: 0; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: #eef2f4; aspect-ratio: 4 / 3; }
    .photo img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .photo-number { position: absolute; top: 6px; left: 6px; color: #fff; background: rgba(0,0,0,.62); border-radius: 3px; padding: 2px 6px; font-size: 11px; }
    .photo-warning { position: absolute; bottom: 5px; left: 5px; right: 5px; color: #fff; background: rgba(80, 65, 0, .78); border-radius: 3px; padding: 3px 5px; font-size: 11px; }
    .no-photo { color: var(--muted); padding: 7px 0 2px; }
    .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 52px 24px; text-align: center; color: var(--muted); }
    .device-block { margin-bottom: 18px; }
    .device-block + .device-block { border-top: 1px solid var(--line); padding-top: 18px; }
    .device-block-heading { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .device-block-heading h3 { font-size: 18px; font-weight: 650; line-height: 1.4; }
    .device-block-heading p { color: var(--muted); margin-top: 4px; }
    .modal { position: fixed; inset: 0; background: rgba(10, 19, 27, .82); display: grid; place-items: center; z-index: 10; padding: 28px; }
    .modal[hidden] { display: none; }
    .modal-content { max-width: min(1180px, 96vw); max-height: 94vh; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .modal-image { max-width: 100%; max-height: calc(94vh - 50px); object-fit: contain; background: #111b22; }
    .modal-footer { display: flex; gap: 12px; align-items: center; color: #e7edf1; font-size: 12px; }
    .modal-footer a, .modal-close { color: #fff; border: 1px solid rgba(255,255,255,.55); background: rgba(0,0,0,.25); border-radius: 4px; padding: 7px 11px; text-decoration: none; }
    .modal-close { cursor: pointer; }
    .error { max-width: 720px; margin: 50px auto; padding: 20px; background: var(--danger-soft); color: var(--danger); border: 1px solid #f1b6b1; border-radius: 8px; }
    @media (max-width: 860px) {
      .topbar, .toolbar { padding-left: 16px; padding-right: 16px; }
      .workspace { display: block; padding: 14px 16px 30px; }
      .sidebar { margin-bottom: 14px; }
      .sidebar-list { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 9px; }
      .sidebar-group-title { display: none; }
      .sidebar-item { width: auto; min-width: 130px; }
      .summary { justify-content: flex-start; }
      .topbar-row { display: block; }
      .summary { margin-top: 14px; }
      .record-count { margin-left: 0; }
    }

    /* Pinterest-inspired presentation layer: data and interactions stay unchanged. */
    :root {
      --bg: #f1f1ec;
      --surface: #ffffff;
      --line: #ecece8;
      --text: #252525;
      --muted: #858581;
      --primary: #e75d50;
      --primary-soft: #fff0ed;
      --success: #238957;
      --success-soft: #e6f5ec;
      --danger: #cc413b;
      --danger-soft: #ffebea;
      --warning: #bc7624;
      --warning-soft: #fff1dd;
      --shadow: 0 10px 28px rgba(44, 44, 39, .09);
    }
    html, body { background: radial-gradient(circle at 12% -8%, #fff 0, transparent 28rem), var(--bg); color: var(--text); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 26px 28px 22px; color: var(--text); }
    .eyebrow { color: var(--muted); letter-spacing: .04em; }
    h1 { font-size: 30px; letter-spacing: -.04em; }
    .project-meta { color: var(--muted); }
    .summary { gap: 9px; }
    .summary-stat { min-width: 90px; padding: 11px 13px; border: 1px solid var(--line); background: #f7f7f4; border-radius: 16px; text-align: left; }
    .summary-value { font-size: 21px; }
    .summary-label { color: var(--muted); }
    .toolbar { background: rgba(255,255,255,.9); border-bottom: 1px solid rgba(236,236,232,.9); box-shadow: 0 6px 16px rgba(44,44,39,.05); backdrop-filter: blur(16px); padding: 13px 28px; }
    .mode-tabs { border: 0; border-radius: 999px; background: #ededeb; padding: 3px; }
    .mode-tabs button { border: 0; border-radius: 999px; padding: 9px 16px; color: var(--muted); }
    .mode-tabs button.active { background: var(--text); color: #fff; }
    .search, .filter { border: 0; border-radius: 999px; background: #ededeb; padding: 10px 14px; }
    .search:focus, .filter:focus { border-color: transparent; box-shadow: 0 0 0 3px rgba(231,93,80,.18); }
    .workspace { padding: 22px 28px 46px; grid-template-columns: 292px minmax(0, 1fr); gap: 22px; }
    .sidebar { border: 0; border-radius: 18px; box-shadow: var(--shadow); position: sticky; top: 124px; }
    .sidebar-heading { padding: 17px 16px; border-bottom: 1px solid var(--line); font-size: 15px; }
    .sidebar-group-title { padding: 14px 16px 7px; color: var(--muted); }
    .sidebar-list { padding: 0 9px 12px; }
    .sidebar-item { border-radius: 13px; padding: 10px 10px; }
    .sidebar-item:hover { background: #f7f7f4; }
    .sidebar-item.active { background: var(--primary-soft); color: var(--danger); }
    .sidebar-item.active .item-count { color: var(--danger); }
    .content-heading { margin-bottom: 16px; }
    .content-heading h2 { font-size: 25px; letter-spacing: -.04em; }
    .badges { gap: 7px; }
    .badge { border-radius: 999px; padding: 6px 10px; font-weight: 700; }
    .item-section { border: 0; border-radius: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .item-header { padding: 16px 17px 13px; border-bottom: 1px solid var(--line); }
    .item-title { font-size: 17px; letter-spacing: -.02em; }
    .item-body { padding: 15px 17px 18px; }
    .note { border-left: 0; border-radius: 13px; background: #f7f7f4; padding: 11px 13px; }
    .photo-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .photo { border: 0; border-radius: 14px; background: #ecece8; box-shadow: 0 4px 12px rgba(44,44,39,.08); }
    .photo img { object-fit: cover; }
    .photo-number { top: 8px; left: 8px; border-radius: 999px; padding: 3px 7px; background: rgba(37,37,37,.68); }
    .device-block { margin-bottom: 22px; }
    .device-block + .device-block { border-top: 0; padding-top: 0; }
    .device-block-heading h3 { font-size: 20px; letter-spacing: -.03em; }
    .empty { border: 0; border-radius: 18px; box-shadow: var(--shadow); padding: 66px 24px; }
    .modal { background: rgba(37,37,37,.84); }
    .modal-footer a, .modal-close { border: 0; border-radius: 999px; padding: 9px 14px; background: rgba(255,255,255,.18); }
    .modal-hint { color: rgba(255,255,255,.72); font-size: 12px; }
    @media (min-width: 861px) {
      html, body { height: 100%; overflow: hidden; }
      .app-shell { height: 100vh; min-height: 0; overflow: hidden; }
      .topbar, .toolbar { flex: 0 0 auto; }
      .toolbar { position: static; }
      .workspace { min-height: 0; height: auto; overflow: hidden; align-items: stretch; }
      .sidebar { position: static; align-self: stretch; height: 100%; overflow-y: auto; overscroll-behavior: contain; }
      .content { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding-right: 6px; }
    }
    @media (max-width: 860px) {
      .topbar { padding-top: 22px; padding-bottom: 20px; }
      .workspace { padding: 16px 16px 30px; }
      .sidebar { position: static; }
      .sidebar, .content { height: auto; overflow: visible; }
      .content-heading h2 { font-size: 22px; }
    }

    /* Hermes Editorial paper treatment: blue remains an accent, never a full-page fill. */
    :root {
      --bg: #f1eee7;
      --surface: #fffdf8;
      --line: #dedbd2;
      --text: #1b2340;
      --muted: #70727b;
      --primary: #2e43a8;
      --primary-soft: #e8ecf8;
      --success: #2e705d;
      --success-soft: #e7f1eb;
      --danger: #a64251;
      --danger-soft: #f8e9ec;
      --warning: #a67b21;
      --warning-soft: #fbf2ca;
      --shadow: 0 12px 32px rgba(32, 45, 112, .08);
      --font-serif: Georgia, "Noto Serif SC", "Songti SC", SimSun, serif;
      --font-sans: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    html, body { background: radial-gradient(circle at 84% -18%, rgba(46,67,168,.10), transparent 34rem), linear-gradient(135deg, #f7f5ef 0%, #efede6 100%); color: var(--text); font-family: var(--font-sans); }
    .topbar { background: rgba(255,253,248,.94); border-bottom-color: var(--line); }
    h1, .content-heading h2, .device-block-heading h3 { font-family: var(--font-serif); }
    .eyebrow, .project-meta, .summary-label, .item-subtitle, .device-block-heading p, .record-count { font-family: var(--font-mono); }
    .toolbar { background: rgba(255,253,248,.94); border-bottom-color: var(--line); box-shadow: 0 6px 16px rgba(32,45,112,.05); }
    .mode-tabs { border: 1px solid var(--line); border-radius: 5px; background: var(--surface); padding: 0; }
    .mode-tabs button { border-radius: 0; color: var(--muted); }
    .mode-tabs button.active { background: var(--primary); }
    .search, .filter { border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--text); }
    .search:focus, .filter:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46,67,168,.12); }
    .type-filters { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; flex: 1 1 100%; padding: 3px 0 1px; }
    .type-filter-label { color: var(--muted); font: 10px var(--font-mono); letter-spacing: .08em; }
    .type-filter-option { display: inline-flex; align-items: center; gap: 5px; color: var(--text); font-size: 12px; }
    .type-filter-option input { width: 14px; height: 14px; accent-color: var(--primary); }
    .sidebar, .item-section, .empty { border: 1px solid var(--line); border-radius: 8px; background: rgba(255,253,248,.92); box-shadow: var(--shadow); }
    .sidebar-item { border-radius: 4px; }
    .sidebar-item.active { background: var(--primary-soft); color: var(--primary); }
    .item-section { border-radius: 8px; box-shadow: 0 4px 14px rgba(32,45,112,.05); }
    .item-header { border-bottom-color: var(--line); }
    .photo { border: 1px solid var(--line); border-radius: 5px; background: var(--paper-3, #f0ede5); box-shadow: none; }
    .note { border-left: 3px solid var(--primary); border-radius: 0; background: #f8f6f0; }
    .badge { border-radius: 4px; font-family: var(--font-mono); font-weight: 500; }
    .modal-close, .modal-footer a { border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="modal" id="photo-modal" hidden>
    <div class="modal-content">
      <img class="modal-image" id="modal-image" alt="">
      <div class="modal-footer">
        <span id="modal-caption"></span>
        <span class="modal-hint" id="modal-hint"></span>
        <a id="modal-download" download>下载原图</a>
        <button class="modal-close" id="modal-close" type="button">关闭</button>
      </div>
    </div>
  </div>
  <script src="data.js"></script>
  <script>
    (() => {
      const data = window.EVIDENCE_EXPORT;
      const app = document.getElementById('app');
      if (!data || !data.project || !Array.isArray(data.devices)) {
        app.innerHTML = '<div class="error">无法读取项目数据。请确认这是完整的项目导出包，并从包内打开 index.html。</div>';
        return;
      }

      const state = { mode: 'device', selectedDeviceId: data.devices[0]?.id ?? null, selectedItemName: null, compliance: 'all', search: '', typeNames: [] };
      let activePhotoButtons = [];
      let activePhotoIndex = -1;
      const byId = new Map(data.devices.map(device => [String(device.id), device]));
      const allItemRecords = () => data.devices.flatMap(device => (device.items || []).map(item => ({ device, item })));
      const itemGroups = () => {
        const groups = new Map();
        allItemRecords().forEach(record => {
          const key = record.item.name;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(record);
        });
        return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], 'zh-CN'));
      };
      const deviceTypes = () => [...new Set(data.devices.map(device => device.typeName).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
      const matches = record => {
        const query = state.search.trim().toLocaleLowerCase();
        const text = `${record.device.name} ${record.device.typeName} ${record.item.name} ${record.item.note || ''}`.toLocaleLowerCase();
        const conclusion = record.item.isNotApplicable ? 'notApplicable' : (record.item.isCompliant ? 'compliant' : 'noncompliant');
        return (!query || text.includes(query)) &&
          (state.compliance === 'all' || state.compliance === conclusion) &&
          (state.typeNames.length === 0 || state.typeNames.includes(record.device.typeName));
      };
      const formatTime = value => value ? new Intl.DateTimeFormat('zh-CN', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value)) : '';
      const escapeText = value => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      const badge = (text, tone) => `<span class="badge ${tone}">${escapeText(text)}</span>`;

      function render() {
        if (state.mode === 'device' && state.typeNames.length > 0) {
          const selected = byId.get(String(state.selectedDeviceId));
          if (!selected || !state.typeNames.includes(selected.typeName)) {
            state.selectedDeviceId = data.devices.find(device => state.typeNames.includes(device.typeName))?.id ?? null;
          }
        }
        const totalPhotos = data.devices.reduce((sum, device) => sum + (device.items || []).reduce((inner, item) => inner + (item.photos || []).length, 0), 0);
        const recordedItems = allItemRecords().filter(record => record.item.isRecorded).length;
        app.innerHTML = `
          <div class="app-shell">
            <header class="topbar">
              <div class="topbar-row">
                <div><div class="eyebrow">等保现场取证项目</div><h1>${escapeText(data.project.name)}</h1><p class="project-meta">创建于 ${formatTime(data.project.createdAt)} · 导出于 ${formatTime(data.exportedAt)}</p></div>
                <div class="summary">
                  <div class="summary-stat"><span class="summary-value">${data.devices.length}</span><span class="summary-label">设备</span></div>
                  <div class="summary-stat"><span class="summary-value">${recordedItems}</span><span class="summary-label">已记录项</span></div>
                  <div class="summary-stat"><span class="summary-value">${totalPhotos}</span><span class="summary-label">照片</span></div>
                </div>
              </div>
            </header>
            <div class="toolbar"><div class="toolbar-inner">
              <div class="mode-tabs"><button data-mode="device" class="${state.mode === 'device' ? 'active' : ''}">按设备查看</button><button data-mode="item" class="${state.mode === 'item' ? 'active' : ''}">按取证项查看</button></div>
              <input class="search" id="search" placeholder="搜索设备或取证项" value="${escapeAttribute(state.search)}">
              <select class="filter" id="compliance"><option value="all" ${state.compliance === 'all' ? 'selected' : ''}>全部结论</option><option value="compliant" ${state.compliance === 'compliant' ? 'selected' : ''}>仅符合</option><option value="noncompliant" ${state.compliance === 'noncompliant' ? 'selected' : ''}>仅不符合</option><option value="notApplicable" ${state.compliance === 'notApplicable' ? 'selected' : ''}>仅不适用</option></select>
              <span class="record-count">${state.mode === 'device' ? '设备视图' : '取证项视图'}</span>
              <div class="type-filters" id="type-filters"><span class="type-filter-label">设备类型</span>${deviceTypes().map(typeName => `<label class="type-filter-option"><input type="checkbox" data-type-filter="${escapeAttribute(typeName)}" ${state.typeNames.includes(typeName) ? 'checked' : ''}>${escapeText(typeName)}</label>`).join('')}</div>
            </div></div>
            <main class="workspace"><aside class="sidebar" id="sidebar"></aside><section class="content" id="content"></section></main>
          </div>`;
        bindToolbar();
        renderSidebar();
        renderContent();
      }

      function escapeAttribute(value) {
        return String(value ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function bindToolbar() {
        document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {
          state.mode = button.dataset.mode;
          if (state.mode === 'item' && !state.selectedItemName) state.selectedItemName = itemGroups()[0]?.[0] ?? null;
          render();
        }));
        document.getElementById('search').addEventListener('input', event => {
          const value = event.target.value;
          const caret = event.target.selectionStart;
          state.search = value;
          render();
          const next = document.getElementById('search');
          next.focus();
          next.setSelectionRange(caret, caret);
        });
        document.getElementById('compliance').addEventListener('change', event => { state.compliance = event.target.value; render(); });
        document.querySelectorAll('[data-type-filter]').forEach(input => input.addEventListener('change', () => {
          state.typeNames = [...document.querySelectorAll('[data-type-filter]:checked')].map(element => element.dataset.typeFilter);
          render();
        }));
      }

      function renderSidebar() {
        const sidebar = document.getElementById('sidebar');
        if (state.mode === 'device') {
          const groups = new Map();
          data.devices.filter(device => state.typeNames.length === 0 || state.typeNames.includes(device.typeName)).forEach(device => { if (!groups.has(device.typeName)) groups.set(device.typeName, []); groups.get(device.typeName).push(device); });
          sidebar.innerHTML = `<div class="sidebar-heading">设备列表</div>` + [...groups.entries()].map(([typeName, devices]) => `
            <div class="sidebar-group-title">${escapeText(typeName)} · ${devices.length} 台</div><div class="sidebar-list">${devices.map(device => `<button class="sidebar-item ${String(device.id) === String(state.selectedDeviceId) ? 'active' : ''}" data-device-id="${device.id}"><span class="item-label">${escapeText(device.name)}</span>${device.missingKeyScreenshotCount ? '<span class="missing-dot" title="关键截图不完整"></span>' : ''}</button>`).join('')}</div>`).join('');
          sidebar.querySelectorAll('[data-device-id]').forEach(button => button.addEventListener('click', () => {
            const sidebarScrollTop = sidebar.scrollTop;
            state.selectedDeviceId = button.dataset.deviceId;
            render();
            document.getElementById('sidebar').scrollTop = sidebarScrollTop;
            document.getElementById('content').scrollTop = 0;
          }));
        } else {
          const groups = itemGroups().filter(([, records]) => records.some(matches));
          sidebar.innerHTML = `<div class="sidebar-heading">取证项列表</div><div class="sidebar-list">${groups.map(([name, records]) => `<button class="sidebar-item ${name === state.selectedItemName ? 'active' : ''}" data-item-name="${escapeAttribute(name)}"><span class="item-label">${escapeText(name)}</span><span class="item-count">${records.filter(matches).length}</span></button>`).join('')}</div>`;
          if (!groups.some(([name]) => name === state.selectedItemName)) state.selectedItemName = groups[0]?.[0] ?? null;
          sidebar.querySelectorAll('[data-item-name]').forEach(button => button.addEventListener('click', () => {
            const sidebarScrollTop = sidebar.scrollTop;
            state.selectedItemName = button.dataset.itemName;
            render();
            document.getElementById('sidebar').scrollTop = sidebarScrollTop;
            document.getElementById('content').scrollTop = 0;
          }));
        }
      }

      function renderContent() {
        const content = document.getElementById('content');
        if (state.mode === 'device') {
          const device = byId.get(String(state.selectedDeviceId));
          if (!device) { content.innerHTML = '<div class="empty">没有可显示的设备</div>'; return; }
          const records = (device.items || []).map(item => ({ device, item })).filter(matches).sort((a, b) => a.item.displayOrder - b.item.displayOrder);
          content.innerHTML = `<div class="content-heading"><div><h2>${escapeText(device.name)}</h2><p>${escapeText(device.typeName)} · 创建于 ${formatTime(device.createdAt)}</p></div><div class="badges">${device.missingKeyScreenshotCount ? badge(`关键截图缺 ${device.missingKeyScreenshotCount} 项`, 'danger') : badge('关键截图完整', 'success')}${badge(`${device.recordedCount}/${device.totalCount} 项已记录`, device.recordedCount === device.totalCount ? 'success' : 'neutral')}</div></div>` + (records.length ? records.map(renderRecord).join('') : '<div class="empty">当前筛选条件下没有取证项</div>');
        } else {
          const records = itemGroups().find(([name]) => name === state.selectedItemName)?.[1].filter(matches) || [];
          content.innerHTML = `<div class="content-heading"><div><h2>${escapeText(state.selectedItemName || '取证项')}</h2><p>显示存在此取证项的设备记录</p></div><div class="badges">${badge(`${records.length} 台设备`, records.length ? 'neutral' : 'warning')}</div></div>` + (records.length ? records.map(record => `<div class="device-block"><div class="device-block-heading"><div><h3>${escapeText(record.device.name)}</h3><p>${escapeText(record.device.typeName)} · ${formatTime(record.device.createdAt)}</p></div></div>${renderRecord(record)}</div>`).join('') : '<div class="empty">当前筛选条件下没有记录</div>');
        }
        bindPhotoLinks();
      }

      function renderRecord(record) {
        const item = record.item;
        const photos = (item.photos || []).slice().sort((a, b) => a.sortOrder - b.sortOrder);
        const complianceBadge = !item.isRecorded ? '' : (item.isNotApplicable ? badge('不适用', 'success') : (item.isCompliant ? badge('符合', 'success') : badge('不符合', 'danger')));
        const recordBadge = item.isRecorded ? badge('已记录', 'neutral') : badge('未记录', 'warning');
        const keyBadge = item.isKeyScreenshot ? badge('关键截图', 'warning') : '';
        const photoGroup = `${record.device.id}-${item.id}`;
        const photosHtml = photos.length ? `<div class="photo-grid">${photos.map((photo, index) => `<button class="photo" data-photo-group="${escapeAttribute(photoGroup)}" data-photo-index="${index}" data-original="${escapeAttribute(photo.originalPath)}" data-thumb="${escapeAttribute(photo.thumbnailPath)}" data-caption="${escapeAttribute(item.name)} · 第 ${index + 1} 张"><img src="${escapeAttribute(photo.thumbnailPath)}" alt="${escapeAttribute(item.name)} 第 ${index + 1} 张"><span class="photo-number">${index + 1}</span>${photo.thumbnailAvailable === false ? '<span class="photo-warning">缩略图不可用，可打开原图</span>' : ''}</button>`).join('')}</div>` : '<div class="no-photo">暂无照片</div>';
        return `<article class="item-section"><div class="item-header"><div class="item-header-main"><div class="item-title">${escapeText(item.name)}</div><div class="item-subtitle">${photos.length} 张照片${item.isTemporary ? ' · 临时取证项' : ''}</div></div><div class="badges">${recordBadge}${complianceBadge}${keyBadge}</div></div><div class="item-body">${item.note ? `<div class="note">${escapeText(item.note)}</div>` : ''}${photosHtml}</div></article>`;
      }

      function bindPhotoLinks() {
        const buttons = [...document.querySelectorAll('[data-original]')];
        buttons.forEach(button => button.addEventListener('click', () => {
          const group = buttons.filter(candidate => candidate.dataset.photoGroup === button.dataset.photoGroup);
          openPhoto(button, group, Number(button.dataset.photoIndex || 0));
        }));
      }

      function openPhoto(button, group, index) {
        activePhotoButtons = group;
        activePhotoIndex = index;
        updatePhotoModal(button);
      }

      function updatePhotoModal(button) {
        const modal = document.getElementById('photo-modal');
        const image = document.getElementById('modal-image');
        const original = button.dataset.original;
        const thumb = button.dataset.thumb;
        const caption = button.dataset.caption;
        image.alt = caption || '取证照片';
        image.src = original;
        image.onerror = () => { image.onerror = null; image.src = thumb; };
        document.getElementById('modal-caption').textContent = caption || '';
        document.getElementById('modal-hint').textContent = activePhotoButtons.length > 1 ? `← / → 切换（${activePhotoIndex + 1}/${activePhotoButtons.length}）` : '';
        const download = document.getElementById('modal-download');
        download.href = original;
        download.download = (original || '').split('/').pop() || '取证照片';
        modal.hidden = false;
      }

      function movePhoto(delta) {
        if (activePhotoButtons.length < 2) return;
        activePhotoIndex = (activePhotoIndex + delta + activePhotoButtons.length) % activePhotoButtons.length;
        updatePhotoModal(activePhotoButtons[activePhotoIndex]);
      }

      function closePhoto() { document.getElementById('photo-modal').hidden = true; document.getElementById('modal-image').src = ''; activePhotoButtons = []; activePhotoIndex = -1; }
      document.getElementById('modal-close').addEventListener('click', closePhoto);
      document.getElementById('photo-modal').addEventListener('click', event => { if (event.target.id === 'photo-modal') closePhoto(); });
      document.addEventListener('keydown', event => {
        const modal = document.getElementById('photo-modal');
        if (modal.hidden) return;
        if (event.key === 'Escape') closePhoto();
        if (event.key === 'ArrowLeft') { event.preventDefault(); movePhoto(-1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); movePhoto(1); }
      });
      render();
    })();
  </script>
</body>
</html>
